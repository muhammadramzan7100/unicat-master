<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .contact-section {
      padding: 50px 0;
    }
   
    .contact-box {
  border: 1px solid black;
  text-align: center;
  padding: 20px;
  width: 250px;
  margin: auto;
  height: 150px; /* Set a fixed height */
  display: flex;
  flex-direction: column;
  justify-content: center;
}

    .contact-box i {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .contact-box h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    .contact-box:hover {
  background-color: #e3f165;
  color: white;
  transform: scale(1.05);
  transition: all 0.3s ease-in-out;
}

    .form-section {
      background-color: #f8f3f321;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
    }
    .btn-primary:hover {
  background-color: #ead817;
  transition: 0.3s ease-in-out;
}
  
    .map-section {
      background-color: #f9f7f7d0;
      width: 100%;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(238, 222, 222, 0.1);
    }
    .map-section iframe {
      width: 100%;
      height: 400px;
      border-radius: 10px;
    }
    .form-image-container {
      display: flex;
      align-items: center;
      padding: 25px;
      margin-top: 15px;
      justify-content: center;
    }
    .web-dev-image {
      max-width: 100%;
      width: 100%;
      height: 690px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(235, 231, 231, 0.1);
    }
  </style>
</head>
<body>
  <section class="contact-section">
    <div class="container">
      <div class="contact-heading text-center mb-4">
                <h1>Contact Us</h1>
        <p>We'd love to hear from you! Reach out to us for any queries or feedback.</p>
      </div>
      
      <div class="row justify-content-center text-center g-3">
        <div class="col-md-3">
          <div class="contact-box">
            <i class="fas fa-phone"></i>
            <h2>Phone Number</h2>
            <p>+92 123 4567890</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="contact-box">
            <i class="fab fa-whatsapp"></i>
            <h2>WhatsApp</h2>
            <p>+92 123 4567890</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="contact-box">
            <i class="fas fa-envelope"></i>
            <h2>Email</h2>
            <p>info@example.com</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="contact-box">
            <i class="fas fa-map-marker-alt"></i>
            <h2>Our Shop</h2>
            <p>123 Main Street,<br>Karachi, Pakistan</p>
          </div>
        </div>
      </div>
      
      <div class="row mt-4 align-items-stretch justify-content-center">
        <div class="col-md-8 map-section">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3618.664060741066!2d67.0302763150068!3d24.90462298402862!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33f90157042d3%3A0x93d609e8bec9a880!2sKarachi%2C%20Pakistan!5e0!3m2!1sen!2s!4v1622549400000!5m2!1sen!2s" height="300px" allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>

      <div class="row mt-4 align-items-center justify-content-center">
        <div class="col-md-5">
          <div class="form-section">
            <h2>Web Development Inquiry</h2>
            <p>Fill out the form below, and we'll get back to you soon.</p>
            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
              </div>
              <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Enter subject">
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Enter your message"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Submit</button>
            </form>
          </div>
        </div>
        <div class="col-md-5 form-image-container">
          <img src="./images/premium_photo-1690303193725-e3a9c08cfca.avif" alt="Web Development" class="web-dev-image">
        </div>
      </div>
      
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</html>
